<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" version="1.1">
  <!-- Background (transparent) -->
  <rect width="500" height="200" fill="none"/>
  
  <!-- Main Color Block Background -->
  <rect x="50" y="50" width="400" height="100" rx="15" ry="15" fill="#00539C"/>
  
  <!-- Main Logo Text -->
  <text x="250" y="120" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#FFFFFF">JSON<tspan fill="#59A5D8">db</tspan></text>
  
  <!-- Left JSON Brace -->
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#F7DF1E">{</text>
  
  <!-- Right JSON Brace -->
  <text x="440" y="120" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#F7DF1E">}</text>
  
  <!-- JS Badge -->
  <rect x="370" y="60" width="35" height="35" rx="5" ry="5" fill="#F7DF1E" stroke="#00539C" stroke-width="1"/>
  <text x="387" y="85" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#000000">JS</text>
  
  <!-- Tagline -->
  <text x="250" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#555555">Native JSON Database with JavaScript Integration</text>
</svg>