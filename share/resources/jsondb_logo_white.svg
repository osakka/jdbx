<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="160" viewBox="0 0 500 160" version="1.1">
  <!-- Background (transparent) -->
  <rect width="500" height="160" fill="none"/>
  
  <!-- Main Logo Text -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#CCCCCC">JSON<tspan fill="#59A5D8">db</tspan></text>
  
  <!-- Left JSON Brace -->
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#F7DF1E">{</text>
  
  <!-- Right JSON Brace -->
  <text x="440" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#F7DF1E">}</text>
  
  <!-- WITH QUICKJS text precisely spaced to match JSONdb width -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="300" fill="#CCCCCC">
    <text x="160" y="120" text-anchor="middle">W</text>
    <text x="175" y="120" text-anchor="middle">I</text>
    <text x="185" y="120" text-anchor="middle">T</text>
    <text x="200" y="120" text-anchor="middle">H</text>
    <text x="225" y="120" text-anchor="middle">Q</text>
    <text x="240" y="120" text-anchor="middle">U</text>
    <text x="255" y="120" text-anchor="middle">I</text>
    <text x="270" y="120" text-anchor="middle">C</text>
    <text x="285" y="120" text-anchor="middle">K</text>
    <text x="300" y="120" text-anchor="middle">J</text>
    <text x="315" y="120" text-anchor="middle">S</text>
  </g>
</svg>