<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" version="1.1">
  <!-- Background (transparent) -->
  <rect width="500" height="200" fill="none"/>
  
  <!-- Stylized JSON with curly braces -->
  <text x="250" y="120" font-family="Arial, sans-serif" font-size="70" font-weight="bold" text-anchor="middle">
    <tspan fill="#00539C">{</tspan><tspan fill="#59A5D8">JSON</tspan><tspan fill="#00539C">}</tspan><tspan fill="#00539C">db</tspan>
  </text>
  
  <!-- Small JS icon integrated into design -->
  <rect x="330" y="85" width="20" height="20" rx="3" ry="3" fill="#F7DF1E" stroke="#000000" stroke-width="1"/>
  <text x="340" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">JS</text>
  
  <!-- Tagline -->
  <text x="250" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#555555">Document Database with Native JavaScript</text>
</svg>