  <polygon points="450,300 445,290 455,290" fill="#00539C"/>
  
  <!-- Core to JavaScript -->
  <line x1="450" y1="450" x2="450" y2="460" stroke="#00539C" stroke-width="2"/>
  <polygon points="450,470 445,460 455,460" fill="#00539C"/>
  
  <!-- JavaScript to Database -->
  <line x1="450" y1="560" x2="450" y2="570" stroke="#00539C" stroke-width="2"/>
  <polygon points="450,580 445,570 455,570" fill="#00539C"/>
  
  <!-- Cross-Component Communications -->
