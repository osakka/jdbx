<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" version="1.1">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FBFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDF7FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg_gradient)" opacity="0.95"/>
  
  <!-- Title and Subtitle -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#00539C">JSONdb Architecture</text>
  <text x="450" y="70" font-family="Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle" fill="#666666">High-performance JSON database with JavaScript integration</text>
  
  <!-- Client Layer -->
  <rect x="150" y="100" width="600" height="70" rx="10" ry="10" fill="#E1F5FE" stroke="#00539C" stroke-width="2"/>
  <text x="450" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">Client Applications</text>
  
  <!-- Client modules -->
  <rect x="180" y="145" width="100" height="30" rx="15" ry="15" fill="#B3E5FC" stroke="#00539C" stroke-width="1"/>
  <text x="230" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C">REST Clients</text>
  
  <rect x="300" y="145" width="100" height="30" rx="15" ry="15" fill="#B3E5FC" stroke="#00539C" stroke-width="1"/>
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C">Web UI</text>
  
  <rect x="420" y="145" width="100" height="30" rx="15" ry="15" fill="#B3E5FC" stroke="#00539C" stroke-width="1"/>
  <text x="470" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C">SDK</text>
  
  <rect x="540" y="145" width="100" height="30" rx="15" ry="15" fill="#B3E5FC" stroke="#00539C" stroke-width="1"/>
  <text x="590" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C">CLI</text>
  
  <!-- API Layer -->
  <rect x="150" y="190" width="600" height="90" rx="10" ry="10" fill="#B3E5FC" stroke="#00539C" stroke-width="2"/>
  <text x="450" y="215" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">API Layer</text>
  
  <!-- API modules -->
  <rect x="180" y="230" width="110" height="35" rx="5" ry="5" fill="#81D4FA" stroke="#00539C" stroke-width="1"/>
  <text x="235" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">REST API</text>
  
  <rect x="310" y="230" width="130" height="35" rx="5" ry="5" fill="#81D4FA" stroke="#00539C" stroke-width="1"/>
  <text x="375" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">JWT Authentication</text>
  
  <rect x="460" y="230" width="110" height="35" rx="5" ry="5" fill="#81D4FA" stroke="#00539C" stroke-width="1"/>
  <text x="515" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">CORS</text>
  
  <rect x="590" y="230" width="110" height="35" rx="5" ry="5" fill="#81D4FA" stroke="#00539C" stroke-width="1"/>
  <text x="645" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">RBAC</text>
  
