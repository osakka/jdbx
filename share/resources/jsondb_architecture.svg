<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" version="1.1">
  <!-- Background rectangle with transparency -->
  <rect width="800" height="600" fill="white" opacity="0.95"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#00539C">JSONdb Architecture</text>
  
  <!-- Client Layer -->
  <rect x="100" y="80" width="600" height="60" rx="10" ry="10" fill="#E1F5FE" stroke="#00539C" stroke-width="2"/>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">Client Applications</text>
  <text x="150" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#00539C">REST</text>
  <text x="250" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#00539C">Web UI</text>
  <text x="550" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#00539C">SDK</text>
  <text x="650" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#00539C">CLI</text>
  
  <!-- API Layer -->
  <rect x="100" y="160" width="600" height="80" rx="10" ry="10" fill="#B3E5FC" stroke="#00539C" stroke-width="2"/>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">API Layer</text>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">REST API</text>
  <text x="400" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Authentication (JWT)</text>
  <text x="600" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">RBAC</text>
  
  <!-- Core Server Components -->
  <rect x="100" y="260" width="600" height="120" rx="10" ry="10" fill="#81D4FA" stroke="#00539C" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">Core Server</text>
  
  <!-- Server Modules -->
  <rect x="120" y="300" width="170" height="60" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="205" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Thread Pool</text>
  
  <rect x="310" y="300" width="170" height="60" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="395" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Socket Handling</text>
  
  <rect x="500" y="300" width="170" height="60" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="585" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Configuration</text>
  
  <!-- JavaScript Integration Layer -->
  <rect x="100" y="400" width="600" height="80" rx="10" ry="10" fill="#4DD0E1" stroke="#00539C" stroke-width="2"/>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">JavaScript Integration (QuickJS)</text>
  <text x="200" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Validators</text>
  <text x="330" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Transformers</text>
  <text x="470" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Custom Functions</text>
  <text x="600" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Query Engine</text>
  
  <!-- Database Engine Layer -->
  <rect x="100" y="500" width="600" height="80" rx="10" ry="10" fill="#26C6DA" stroke="#00539C" stroke-width="2"/>
  <text x="400" y="525" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">Database Engine</text>
  <text x="200" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Collections</text>
  <text x="330" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Document Storage</text>
  <text x="470" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Transactions</text>
  <text x="600" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00539C">Caching</text>
  
  <!-- Connecting lines -->
  <line x1="400" y1="140" x2="400" y2="160" stroke="#00539C" stroke-width="2"/>
  <line x1="400" y1="240" x2="400" y2="260" stroke="#00539C" stroke-width="2"/>
  <line x1="400" y1="380" x2="400" y2="400" stroke="#00539C" stroke-width="2"/>
  <line x1="400" y1="480" x2="400" y2="500" stroke="#00539C" stroke-width="2"/>
  
  <!-- Additional Components on sides (connected with lines) -->
  <!-- Metrics System -->
  <rect x="720" y="300" width="100" height="60" rx="5" ry="5" fill="#B2EBF2" stroke="#00539C" stroke-width="1" transform="translate(20, 0)"/>
  <text x="770" y="330" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C" transform="translate(20, 0)">Metrics</text>
  <line x1="700" y1="330" x2="720" y2="330" stroke="#00539C" stroke-width="1" transform="translate(20, 0)"/>
  
  <!-- Visualization -->
  <rect x="720" y="380" width="100" height="60" rx="5" ry="5" fill="#B2EBF2" stroke="#00539C" stroke-width="1" transform="translate(20, 0)"/>
  <text x="770" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C" transform="translate(20, 0)">Visualization</text>
  <line x1="700" y1="410" x2="720" y2="410" stroke="#00539C" stroke-width="1" transform="translate(20, 0)"/>
  
  <!-- Logging System -->
  <rect x="-20" y="300" width="100" height="60" rx="5" ry="5" fill="#B2EBF2" stroke="#00539C" stroke-width="1"/>
  <text x="30" y="330" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C">Logging</text>
  <line x1="80" y1="330" x2="100" y2="330" stroke="#00539C" stroke-width="1"/>
  
  <!-- Security System -->
  <rect x="-20" y="380" width="100" height="60" rx="5" ry="5" fill="#B2EBF2" stroke="#00539C" stroke-width="1"/>
  <text x="30" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00539C">Security</text>
  <line x1="80" y1="410" x2="100" y2="410" stroke="#00539C" stroke-width="1"/>
</svg>