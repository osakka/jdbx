  <text x="235" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Thread Pool</text>
  <text x="235" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Worker Threading</text>
  
  <rect x="310" y="340" width="130" height="45" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="375" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Socket Handling</text>
  <text x="375" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Connection Management</text>
  
  <rect x="450" y="340" width="130" height="45" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="515" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Configuration</text>
  <text x="515" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Environment Variables</text>
  
  <rect x="590" y="340" width="130" height="45" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="655" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Daemon Mode</text>
  <text x="655" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Process Management</text>
  
  <!-- Server Modules Row 2 -->
  <rect x="170" y="395" width="130" height="45" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="235" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Process Forking</text>
  <text x="235" y="435" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Child Process Handling</text>
  
  <rect x="310" y="395" width="130" height="45" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="375" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Signal Handling</text>
  <text x="375" y="435" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Graceful Shutdown</text>
  
  <rect x="450" y="395" width="130" height="45" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="515" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Error Handling</text>
  <text x="515" y="435" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Error Propagation</text>
  
  <rect x="590" y="395" width="130" height="45" rx="5" ry="5" fill="#4FC3F7" stroke="#00539C" stroke-width="1"/>
  <text x="655" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Resource Cleanup</text>
  <text x="655" y="435" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Memory Management</text>
  
