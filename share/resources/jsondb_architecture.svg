  <text x="345" y="642" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Documents</text>
  
  <rect x="410" y="620" width="110" height="35" rx="5" ry="5" fill="#00BCD4" stroke="#00539C" stroke-width="1"/>
  <text x="465" y="642" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Transactions</text>
  
  <rect x="530" y="620" width="110" height="35" rx="5" ry="5" fill="#00BCD4" stroke="#00539C" stroke-width="1"/>
  <text x="585" y="642" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Caching</text>
  
  <!-- Connection lines (with arrows) -->
