  <text x="450" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00539C">JavaScript Integration (QuickJS)</text>
  
  <!-- JS modules -->
  <rect x="170" y="510" width="130" height="35" rx="5" ry="5" fill="#26C6DA" stroke="#00539C" stroke-width="1"/>
  <text x="235" y="532" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Validators</text>
  
  <rect x="310" y="510" width="130" height="35" rx="5" ry="5" fill="#26C6DA" stroke="#00539C" stroke-width="1"/>
  <text x="375" y="532" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Transformers</text>
  
  <rect x="450" y="510" width="130" height="35" rx="5" ry="5" fill="#26C6DA" stroke="#00539C" stroke-width="1"/>
