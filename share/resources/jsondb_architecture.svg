  <polygon points="130,495 120,490 120,500" fill="#00539C"/>
  <text x="85" y="440" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C" transform="rotate(-90 85,440)">Engine Callbacks</text>
  
  <path d="M 780,380 C 800,380 800,495 780,495" stroke="#00539C" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <polygon points="770,495 780,490 780,500" fill="#00539C"/>
  <text x="815" y="440" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C" transform="rotate(90 815,440)">Event Notifications</text>
  
  <!-- Additional Components with better styling -->
  <!-- Logging System -->
  <rect x="30" y="330" width="100" height="140" rx="5" ry="5" fill="#E0F7FA" stroke="#00539C" stroke-width="1.5"/>
  <text x="80" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Logging</text>
  <line x1="50" y1="360" x2="110" y2="360" stroke="#00539C" stroke-width="1"/>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Error Logs</text>
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Access Logs</text>
  <text x="80" y="415" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Audit Logs</text>
  <text x="80" y="435" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Debug Logs</text>
  <line x1="130" y1="375" x2="150" y2="375" stroke="#00539C" stroke-width="1"/>
  <polygon points="150,375 145,372 145,378" fill="#00539C"/>
  
  <!-- Security System -->
  <rect x="30" y="490" width="100" height="100" rx="5" ry="5" fill="#E0F7FA" stroke="#00539C" stroke-width="1.5"/>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Security</text>
  <line x1="50" y1="520" x2="110" y2="520" stroke="#00539C" stroke-width="1"/>
  <text x="80" y="535" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Encryption</text>
  <text x="80" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Token Validation</text>
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Auth Monitoring</text>
  <line x1="130" y1="535" x2="150" y2="535" stroke="#00539C" stroke-width="1"/>
  <polygon points="150,535 145,532 145,538" fill="#00539C"/>
  
  <!-- Metrics System -->
  <rect x="770" y="330" width="100" height="140" rx="5" ry="5" fill="#E0F7FA" stroke="#00539C" stroke-width="1.5"/>
  <text x="820" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Metrics</text>
  <line x1="790" y1="360" x2="850" y2="360" stroke="#00539C" stroke-width="1"/>
  <text x="820" y="375" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Performance</text>
  <text x="820" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Usage Stats</text>
  <text x="820" y="415" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">System Health</text>
  <text x="820" y="435" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Query Analytics</text>
  <line x1="750" y1="375" x2="770" y2="375" stroke="#00539C" stroke-width="1"/>
  <polygon points="750,375 755,372 755,378" fill="#00539C"/>
  
  <!-- Visualization -->
  <rect x="770" y="490" width="100" height="100" rx="5" ry="5" fill="#E0F7FA" stroke="#00539C" stroke-width="1.5"/>
  <text x="820" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Visualization</text>
  <line x1="790" y1="520" x2="850" y2="520" stroke="#00539C" stroke-width="1"/>
  <text x="820" y="535" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Dashboards</text>
  <text x="820" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Transaction Views</text>
  <text x="820" y="575" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Admin Interface</text>
  <line x1="750" y1="535" x2="770" y2="535" stroke="#00539C" stroke-width="1"/>
  <polygon points="750,535 755,532 755,538" fill="#00539C"/>
  
  <!-- Legend -->
  <rect x="300" y="685" width="300" height="25" rx="5" ry="5" fill="#FFFFFF" stroke="#00539C" stroke-width="1"/>
  
  <rect x="310" y="690" width="15" height="15" fill="#E1F5FE" stroke="#00539C" stroke-width="1"/>
  <text x="350" y="702" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Client Layer</text>
  
  <rect x="390" y="690" width="15" height="15" fill="#B3E5FC" stroke="#00539C" stroke-width="1"/>
  <text x="430" y="702" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">API Layer</text>
  
  <rect x="470" y="690" width="15" height="15" fill="#81D4FA" stroke="#00539C" stroke-width="1"/>
  <text x="510" y="702" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Core Layer</text>
  
  <rect x="550" y="690" width="15" height="15" fill="#4DD0E1" stroke="#00539C" stroke-width="1"/>
  <text x="590" y="702" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00539C">Data Layers</text>
