  <rect x="590" y="510" width="130" height="35" rx="5" ry="5" fill="#26C6DA" stroke="#00539C" stroke-width="1"/>
  <text x="655" y="532" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00539C">Query Engine</text>
  
