<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="160" viewBox="0 0 500 160" version="1.1">
  <!-- Background (transparent) -->
  <rect width="500" height="160" fill="none"/>
  
  <!-- Main Logo Text -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#333333">JSON<tspan fill="#667eea">db</tspan></text>
  
  <!-- Left JSON Brace -->
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#667eea">{</text>
  
  <!-- Right JSON Brace -->
  <text x="440" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#667eea">}</text>
  
  <!-- WITH QUICKJS text precisely spaced to match JSONdb width -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="300" fill="#6c757d">
    <text x="253" y="120" text-anchor="middle">with QUICKJS</text>
  </g>
