<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" version="1.1">
  <!-- Background (transparent) -->
  <rect width="500" height="200" fill="none"/>
  
  <!-- Main Logo Text -->
  <text x="250" y="110" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#00539C">JSONdb</text>
  
  <!-- JavaScript Element: Yellow JS Box with Dark Text -->
  <rect x="110" y="70" width="40" height="40" rx="5" ry="5" fill="#F7DF1E" stroke="#000000" stroke-width="1"/>
  <text x="130" y="100" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#000000">JS</text>
  
  <!-- Stylized Database Icon -->
  <ellipse cx="375" cy="70" rx="25" ry="10" fill="#59A5D8" stroke="#00539C" stroke-width="2"/>
  <rect x="350" y="70" width="50" height="40" fill="#59A5D8" stroke="none"/>
  <ellipse cx="375" cy="110" rx="25" ry="10" fill="#59A5D8" stroke="#00539C" stroke-width="2"/>
  
  <!-- Braces to Represent JSON -->
  <text x="190" y="110" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#00539C">{</text>
  <text x="320" y="110" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#00539C">}</text>
  
  <!-- Tagline -->
  <text x="250" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#555555">Native JSON Database with JavaScript Integration</text>
  
  <!-- Subtle connection lines -->
  <path d="M 150 90 L 170 90" stroke="#00539C" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M 330 90 L 350 90" stroke="#00539C" stroke-width="2" stroke-dasharray="2,2"/>
</svg>