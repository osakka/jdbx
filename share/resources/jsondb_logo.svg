<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" version="1.1">
  <!-- Background rectangle with transparency -->
  <rect width="500" height="500" fill="none"/>
  
  <!-- JavaScript element: bracket with script color -->
  <path d="M 320,120 L 380,120 L 350,380 L 290,380 Z" fill="#f7df1e" stroke="#000000" stroke-width="5"/>
  <path d="M 350,280 C 350,310 340,330 310,330 L 310,300 C 325,300 320,290 320,280 Z" fill="#000000"/>
  <path d="M 310,230 L 340,230 L 340,330 L 310,330 Z" fill="#000000"/>
  
  <!-- Database cylinders with json colors -->
  <ellipse cx="200" cy="150" rx="130" ry="40" fill="#59A5D8" stroke="#00539C" stroke-width="5"/>
  <rect x="70" y="150" width="260" height="100" fill="#59A5D8" stroke="none"/>
  <ellipse cx="200" cy="250" rx="130" ry="40" fill="#59A5D8" stroke="#00539C" stroke-width="5"/>
  <rect x="70" y="250" width="260" height="100" fill="#59A5D8" stroke="none"/>
  <ellipse cx="200" cy="350" rx="130" ry="40" fill="#59A5D8" stroke="#00539C" stroke-width="5"/>
  
  <!-- JSON Bracket symbol -->
  <path d="M 140,160 C 135,160 130,165 130,170 L 130,320 C 130,335 120,340 105,340 L 105,370 C 140,370 160,350 160,320 L 160,170 C 160,165 165,160 170,160 Z" fill="#00539C" stroke="#ffffff" stroke-width="2"/>
  <path d="M 260,160 C 265,160 270,165 270,170 L 270,320 C 270,335 280,340 295,340 L 295,370 C 260,370 240,350 240,320 L 240,170 C 240,165 235,160 230,160 Z" fill="#00539C" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Lock symbol for RBAC -->
  <rect x="175" y="180" width="50" height="40" rx="5" ry="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="185" y="160" width="30" height="30" rx="10" ry="10" fill="none" stroke="#000000" stroke-width="4"/>
  
  <!-- Token symbol for JWT -->
  <circle cx="200" cy="280" r="25" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <path d="M 185,275 L 215,275 M 185,285 L 215,285 M 200,265 L 200,295" stroke="#000000" stroke-width="2"/>
  
  <!-- Text Elements -->
  <text x="250" y="450" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#00539C">JSONdb</text>
  <!-- Simple connecting lines for completeness -->
  <path d="M 200,390 L 200,410" stroke="#00539C" stroke-width="4"/>
</svg>