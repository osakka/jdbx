<!DOCTYPE html>
<html>
<head>
    <title>Minimal RBAC Test</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Minimal RBAC Test</h1>
    
    <div class="debug">
        <h3>Test 1: Direct RBAC HTML</h3>
        <button onclick="loadRBACDirectly()">Load RBAC HTML Directly</button>
        <div id="test1-result"></div>
    </div>
    
    <div class="debug">
        <h3>Test 2: Check Bootstrap Tabs</h3>
        <button onclick="testBootstrapTabs()">Test Bootstrap Tabs</button>
        <div id="test2-result"></div>
    </div>
    
    <div class="debug">
        <h3>Test 3: Find Admin Text</h3>
        <button onclick="findAdminText()">Find All "admin" Text</button>
        <div id="test3-result"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadRBACDirectly() {
            // Fetch the main page
            const response = await fetch('/index.html');
            const html = await response.text();
            
            // Parse and extract RBAC view
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const rbacView = doc.getElementById('rbac-view');
            
            const result = document.getElementById('test1-result');
            if (rbacView) {
                result.innerHTML = `
                    <p><strong>RBAC View Found!</strong></p>
                    <p>HTML Length: ${rbacView.innerHTML.length}</p>
                    <p>Text Preview: ${rbacView.textContent.substring(0, 100)}...</p>
                    <p>Children: ${rbacView.children.length}</p>
                    <details>
                        <summary>View HTML Structure</summary>
                        <pre>${escapeHtml(rbacView.innerHTML.substring(0, 500))}...</pre>
                    </details>
                `;
            } else {
                result.innerHTML = '<p class="text-danger">RBAC view not found!</p>';
            }
        }
        
        function testBootstrapTabs() {
            const result = document.getElementById('test2-result');
            
            // Create a simple Bootstrap tab structure
            result.innerHTML = `
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#test-users">Users</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#test-roles">Roles</button>
                    </li>
                </ul>
                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="test-users">
                        <p>Users tab content - contains word: admin (username)</p>
                    </div>
                    <div class="tab-pane fade" id="test-roles">
                        <p>Roles tab content - this is what you want to see</p>
                    </div>
                </div>
                <p class="mt-3 text-info">Click the "Roles" tab above to switch content</p>
            `;
        }
        
        async function findAdminText() {
            const response = await fetch('/');
            const html = await response.text();
            
            // Count occurrences of "admin"
            const adminCount = (html.match(/admin/gi) || []).length;
            const standaloneAdminCount = (html.match(/>\s*admin\s*</gi) || []).length;
            
            const result = document.getElementById('test3-result');
            result.innerHTML = `
                <p>Total occurrences of "admin": ${adminCount}</p>
                <p>Standalone "admin" text: ${standaloneAdminCount}</p>
                <p class="text-warning">Note: If you're seeing "admin" on screen, it's likely the username in the Users table, not a bug.</p>
            `;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
