<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONdb - Choose Interface</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .choice-container {
            text-align: center;
            color: white;
        }
        .choice-cards {
            display: flex;
            gap: 2rem;
            margin-top: 3rem;
        }
        .choice-card {
            background: white;
            color: #333;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            cursor: pointer;
            text-decoration: none;
        }
        .choice-card:hover {
            transform: translateY(-5px);
            text-decoration: none;
            color: #333;
        }
        .choice-card i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="choice-container">
        <h1 class="display-4 mb-3">
            <i class="bi bi-database-fill me-3"></i>JSONdb
        </h1>
        <p class="lead">Choose your interface</p>
        
        <div class="choice-cards">
            <a href="/admin.html" class="choice-card">
                <i class="bi bi-speedometer2 d-block"></i>
                <h3>Simple Admin</h3>
                <p class="mb-0">Clean, focused interface<br>for database management</p>
            </a>
            
            <a href="/index.html" class="choice-card">
                <i class="bi bi-grid-3x3-gap d-block"></i>
                <h3>Classic Admin</h3>
                <p class="mb-0">Full-featured interface<br>with all options</p>
            </a>
            
            <a href="/demo.html" class="choice-card">
                <i class="bi bi-cart3 d-block"></i>
                <h3>Demo App</h3>
                <p class="mb-0">E-commerce demo<br>showcasing JSONdb</p>
            </a>
        </div>
    </div>
</body>
</html>
