<!DOCTYPE html>
<html>
<head>
    <title>Catch Admin Overwrite</title>
    <script>
        // Intercept ALL property setters before any other scripts load
        const props = ['innerHTML', 'innerText', 'textContent', 'outerHTML'];
        const intercepted = new Map();
        
        props.forEach(prop => {
            const original = Object.getOwnPropertyDescriptor(Element.prototype, prop) || 
                            Object.getOwnPropertyDescriptor(HTMLElement.prototype, prop) ||
                            Object.getOwnPropertyDescriptor(Node.prototype, prop);
            
            if (original && original.set) {
                const target = prop === 'textContent' ? Node.prototype : Element.prototype;
                Object.defineProperty(target, prop, {
                    set: function(value) {
                        // Track all changes
                        if (!intercepted.has(this)) {
                            intercepted.set(this, []);
                        }
                        intercepted.get(this).push({
                            prop: prop,
                            value: value,
                            timestamp: Date.now(),
                            stack: new Error().stack
                        });
                        
                        // Alert on "admin"
                        if (typeof value === 'string' && value.trim() === 'admin') {
                            console.error(`INTERCEPTED: ${prop} = "admin"`);
                            console.error('Element:', this);
                            console.error('Stack:', new Error().stack);
                            
                            // If it's RBAC related, block it
                            if (this.id === 'rbac-view' || this.closest && this.closest('#rbac-view')) {
                                console.error('BLOCKED RBAC OVERWRITE!');
                                window.LAST_BLOCKED_ADMIN = {
                                    element: this,
                                    prop: prop,
                                    stack: new Error().stack
                                };
                                return;
                            }
                        }
                        
                        return original.set.call(this, value);
                    },
                    get: original.get,
                    configurable: true
                });
            }
        });
        
        console.log('Admin overwrite interceptor installed');
        
        // Also override appendChild/replaceChild
        const originalAppendChild = Node.prototype.appendChild;
        Node.prototype.appendChild = function(child) {
            if (child && child.textContent && child.textContent.trim() === 'admin') {
                console.error('INTERCEPTED: appendChild with "admin"');
                console.error('Parent:', this);
                console.error('Child:', child);
                console.trace();
            }
            return originalAppendChild.call(this, child);
        };
    </script>
</head>
<body>
    <h1>Loading main app with interceptor...</h1>
    <iframe src="/index.html#rbac" style="width: 100%; height: 600px; border: 2px solid red;"></iframe>
    
    <button onclick="showIntercepted()">Show All Intercepted Changes</button>
    <pre id="results"></pre>
    
    <script>
        function showIntercepted() {
            const results = document.getElementById('results');
            const data = [];
            intercepted.forEach((changes, element) => {
                changes.forEach(change => {
                    if (change.value && change.value.toString().includes('admin')) {
                        data.push({
                            element: element.tagName + (element.id ? '#' + element.id : ''),
                            prop: change.prop,
                            value: change.value.substring(0, 100),
                            stack: change.stack
                        });
                    }
                });
            });
            results.textContent = JSON.stringify(data, null, 2);
        }
        
        // Check iframe too
        window.addEventListener('load', () => {
            setTimeout(() => {
                const iframe = document.querySelector('iframe');
                const iframeDoc = iframe.contentDocument;
                const rbacView = iframeDoc.getElementById('rbac-view');
                console.log('RBAC view after load:', rbacView ? rbacView.textContent.substring(0, 100) : 'null');
                
                if (window.LAST_BLOCKED_ADMIN) {
                    console.error('WE BLOCKED AN ADMIN OVERWRITE!', window.LAST_BLOCKED_ADMIN);
                }
            }, 3000);
        });
    </script>
</body>
</html>
