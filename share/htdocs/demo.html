<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - JSONdb Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .product-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .price {
            font-size: 1.5rem;
            color: #28a745;
            font-weight: bold;
        }
        .sku {
            color: #6c757d;
            font-size: 0.875rem;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 40px;
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }
        .loading-spinner {
            display: none;
        }
        .category-filter {
            cursor: pointer;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            border-radius: 20px;
            background: #e9ecef;
            transition: all 0.3s;
        }
        .category-filter:hover,
        .category-filter.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-database-fill me-2"></i>JSONdb Store
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-speedometer2 me-1"></i>Admin Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="#" id="cart-btn">
                            <i class="bi bi-cart3"></i> Cart
                            <span class="cart-badge" id="cart-count" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="container text-center">
            <h1 class="display-4 mb-4">Welcome to JSONdb Store</h1>
            <p class="lead mb-4">A demo e-commerce application powered by JSONdb</p>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="form-control" id="search-input" placeholder="Search products...">
                        <button class="btn btn-light" type="button" id="search-btn">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Category Filters -->
        <div class="text-center mb-4">
            <div class="d-inline-flex flex-wrap" id="category-filters">
                <span class="category-filter active" data-category="all">All Products</span>
                <!-- Categories will be dynamically added here -->
            </div>
        </div>

        <!-- Loading Spinner -->
        <div class="text-center loading-spinner" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading products...</p>
        </div>

        <!-- Products Grid -->
        <div class="row" id="products-grid">
            <!-- Products will be dynamically loaded here -->
        </div>

        <!-- No Products Message -->
        <div class="text-center py-5" id="no-products" style="display: none;">
            <i class="bi bi-inbox display-1 text-muted"></i>
            <h3 class="mt-3 text-muted">No products found</h3>
            <p class="text-muted">Try adjusting your search or filters</p>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Shopping Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cart-items">
                        <!-- Cart items will be displayed here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="w-100">
                        <div class="d-flex justify-content-between mb-3">
                            <h5>Total:</h5>
                            <h5 id="cart-total">$0.00</h5>
                        </div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Continue Shopping</button>
                        <button type="button" class="btn btn-primary float-end" onclick="checkout()">
                            <i class="bi bi-credit-card me-2"></i>Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="product-modal-title">Product Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="product-modal-body">
                    <!-- Product details will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Configuration
        const API_BASE_URL = window.location.origin;
        const COLLECTION_NAME = 'demo_products';
        
        // State
        let products = [];
        let categories = new Set();
        let cart = JSON.parse(localStorage.getItem('demo_cart') || '[]');
        let currentFilter = 'all';
        let authToken = localStorage.getItem('jsondb_auth_token');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateCartBadge();
            loadProducts();
            
            // Event listeners
            document.getElementById('search-btn').addEventListener('click', performSearch);
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
            document.getElementById('cart-btn').addEventListener('click', showCart);
        });

        // Load products from JSONdb
        async function loadProducts() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('products-grid');
            const noProducts = document.getElementById('no-products');
            
            loading.style.display = 'block';
            grid.innerHTML = '';
            noProducts.style.display = 'none';
            
            try {
                const headers = {
                    'Accept': 'application/json'
                };
                
                // Add auth token if available
                if (authToken) {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }
                
                const response = await fetch(`${API_BASE_URL}/api/collections/${COLLECTION_NAME}/documents`, {
                    headers: headers
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                products = data.documents || [];
                
                // Extract categories
                categories.clear();
                products.forEach(product => {
                    if (product.category) {
                        categories.add(product.category);
                    }
                });
                
                // Update category filters
                updateCategoryFilters();
                
                // Display products
                displayProducts(products);
                
            } catch (error) {
                console.error('Error loading products:', error);
                grid.innerHTML = `
                    <div class="col-12 text-center">
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            Error loading products. Please ensure JSONdb server is running.
                        </div>
                    </div>
                `;
            } finally {
                loading.style.display = 'none';
            }
        }

        // Update category filters
        function updateCategoryFilters() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '<span class="category-filter active" data-category="all">All Products</span>';
            
            Array.from(categories).sort().forEach(category => {
                const filter = document.createElement('span');
                filter.className = 'category-filter';
                filter.dataset.category = category;
                filter.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                filter.addEventListener('click', () => filterByCategory(category));
                container.appendChild(filter);
            });
            
            // Re-add click listener for "All Products"
            container.querySelector('[data-category="all"]').addEventListener('click', () => filterByCategory('all'));
        }

        // Filter products by category
        function filterByCategory(category) {
            currentFilter = category;
            
            // Update active filter
            document.querySelectorAll('.category-filter').forEach(filter => {
                filter.classList.toggle('active', filter.dataset.category === category);
            });
            
            // Filter and display products
            const filtered = category === 'all' 
                ? products 
                : products.filter(p => p.category === category);
            
            displayProducts(filtered);
        }

        // Display products in grid
        function displayProducts(productsToShow) {
            const grid = document.getElementById('products-grid');
            const noProducts = document.getElementById('no-products');
            
            if (productsToShow.length === 0) {
                grid.innerHTML = '';
                noProducts.style.display = 'block';
                return;
            }
            
            noProducts.style.display = 'none';
            grid.innerHTML = productsToShow.map(product => `
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card product-card">
                        <div class="card-body">
                            <h5 class="card-title">${escapeHtml(product.name)}</h5>
                            <p class="sku">SKU: ${escapeHtml(product.sku || 'N/A')}</p>
                            <p class="card-text">${escapeHtml(product.description || '')}</p>
                            ${product.features ? `
                                <ul class="small">
                                    ${product.features.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
                                </ul>
                            ` : ''}
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="price">$${(product.price || 0).toFixed(2)}</span>
                                <span class="badge bg-${product.stock > 50 ? 'success' : product.stock > 0 ? 'warning' : 'danger'}">
                                    ${product.stock > 0 ? `${product.stock} in stock` : 'Out of stock'}
                                </span>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-primary btn-sm" onclick="addToCart('${product._id}')" 
                                        ${product.stock === 0 ? 'disabled' : ''}>
                                    <i class="bi bi-cart-plus me-1"></i>Add to Cart
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="viewProduct('${product._id}')">
                                    <i class="bi bi-eye me-1"></i>View
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Search products
        function performSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(product => 
                product.name.toLowerCase().includes(query) ||
                (product.description && product.description.toLowerCase().includes(query)) ||
                (product.sku && product.sku.toLowerCase().includes(query))
            );
            displayProducts(filtered);
        }

        // Add product to cart
        function addToCart(productId) {
            const product = products.find(p => p._id === productId);
            if (!product) return;
            
            const existingItem = cart.find(item => item._id === productId);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }
            
            localStorage.setItem('demo_cart', JSON.stringify(cart));
            updateCartBadge();
            
            // Show toast notification
            showToast(`${product.name} added to cart!`);
        }

        // Update cart badge
        function updateCartBadge() {
            const badge = document.getElementById('cart-count');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // Show cart modal
        function showCart() {
            const modal = new bootstrap.Modal(document.getElementById('cartModal'));
            const cartItems = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-center">Your cart is empty</p>';
                cartTotal.textContent = '$0.00';
            } else {
                cartItems.innerHTML = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${cart.map(item => `
                                <tr>
                                    <td>${escapeHtml(item.name)}</td>
                                    <td>$${item.price.toFixed(2)}</td>
                                    <td>
                                        <input type="number" class="form-control form-control-sm" style="width: 80px"
                                               value="${item.quantity}" min="1" max="${item.stock}"
                                               onchange="updateQuantity('${item._id}', this.value)">
                                    </td>
                                    <td>$${(item.price * item.quantity).toFixed(2)}</td>
                                    <td>
                                        <button class="btn btn-sm btn-danger" onclick="removeFromCart('${item._id}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                cartTotal.textContent = `$${total.toFixed(2)}`;
            }
            
            modal.show();
        }

        // Update quantity in cart
        function updateQuantity(productId, newQuantity) {
            const item = cart.find(i => i._id === productId);
            if (item) {
                item.quantity = parseInt(newQuantity) || 1;
                localStorage.setItem('demo_cart', JSON.stringify(cart));
                updateCartBadge();
                showCart(); // Refresh cart display
            }
        }

        // Remove from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item._id !== productId);
            localStorage.setItem('demo_cart', JSON.stringify(cart));
            updateCartBadge();
            showCart(); // Refresh cart display
        }

        // View product details
        function viewProduct(productId) {
            const product = products.find(p => p._id === productId);
            if (!product) return;
            
            const modal = new bootstrap.Modal(document.getElementById('productModal'));
            document.getElementById('product-modal-title').textContent = product.name;
            document.getElementById('product-modal-body').innerHTML = `
                <div class="mb-3">
                    <strong>SKU:</strong> ${escapeHtml(product.sku || 'N/A')}
                </div>
                <div class="mb-3">
                    <strong>Price:</strong> <span class="price">$${product.price.toFixed(2)}</span>
                </div>
                <div class="mb-3">
                    <strong>Stock:</strong> ${product.stock} units
                </div>
                <div class="mb-3">
                    <strong>Category:</strong> ${escapeHtml(product.category || 'Uncategorized')}
                </div>
                <div class="mb-3">
                    <strong>Description:</strong><br>
                    ${escapeHtml(product.description || 'No description available')}
                </div>
                ${product.features ? `
                    <div class="mb-3">
                        <strong>Features:</strong>
                        <ul>
                            ${product.features.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
                ${product.material ? `
                    <div class="mb-3">
                        <strong>Material:</strong> ${escapeHtml(product.material)}
                    </div>
                ` : ''}
                ${product.capacity ? `
                    <div class="mb-3">
                        <strong>Capacity:</strong> ${escapeHtml(product.capacity)}
                    </div>
                ` : ''}
                <div class="text-center mt-4">
                    <button class="btn btn-primary" onclick="addToCart('${product._id}')" 
                            ${product.stock === 0 ? 'disabled' : ''}>
                        <i class="bi bi-cart-plus me-2"></i>Add to Cart
                    </button>
                </div>
            `;
            
            modal.show();
        }

        // Checkout (demo only)
        function checkout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            // In a real app, this would create an order in the database
            alert(`Thank you for your order!\n\nTotal: $${total.toFixed(2)}\n\nThis is a demo - no actual order was placed.`);
            
            // Clear cart
            cart = [];
            localStorage.setItem('demo_cart', JSON.stringify(cart));
            updateCartBadge();
            
            // Close modal
            bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide();
        }

        // Show toast notification
        function showToast(message) {
            // Create toast element
            const toast = document.createElement('div');
            toast.className = 'position-fixed bottom-0 end-0 p-3';
            toast.style.zIndex = '11';
            toast.innerHTML = `
                <div class="toast show" role="alert">
                    <div class="toast-header">
                        <strong class="me-auto">JSONdb Store</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;
            
            document.body.appendChild(toast);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text ? text.replace(/[&<>"']/g, m => map[m]) : '';
        }
    </script>
</body>
</html>
