<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONdb Metrics Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .metric-card {
            transition: transform 0.2s;
        }
        .metric-card:hover {
            transform: translateY(-5px);
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-speedometer2 me-2"></i>JSONdb Metrics
            </a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Admin Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="demo.html">Product Demo</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-4">System Metrics Dashboard</h1>
        
        <!-- Overview Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Collections</h5>
                        <h2 class="mb-0" id="collections-count">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Total Documents</h5>
                        <h2 class="mb-0" id="documents-count">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Database Size</h5>
                        <h2 class="mb-0" id="database-size">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Uptime</h5>
                        <h2 class="mb-0" id="uptime">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Documents per Collection</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="collections-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">System Health</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="health-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Collections Details -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">Collection Details</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Collection Name</th>
                            <th>Document Count</th>
                            <th>Avg Document Size</th>
                            <th>Last Modified</th>
                        </tr>
                    </thead>
                    <tbody id="collections-table">
                        <tr>
                            <td colspan="4" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        let authToken = localStorage.getItem('jsondb_auth_token');
        let collectionsChart = null;
        let healthChart = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadMetrics();
            // Refresh every 5 seconds
            setInterval(loadMetrics, 5000);
        });

        async function loadMetrics() {
            try {
                // Load health data
                const healthResponse = await fetch(`${API_BASE_URL}/health`);
                const healthData = await healthResponse.json();
                
                // Update uptime
                document.getElementById('uptime').textContent = healthData.uptime || 'N/A';
                
                // Update health chart
                updateHealthChart(healthData);
                
                // Load collections data
                const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
                const collectionsResponse = await fetch(`${API_BASE_URL}/api/collections`, { headers });
                const collectionsData = await collectionsResponse.json();
                
                if (collectionsData.collections) {
                    // Update collections count
                    document.getElementById('collections-count').textContent = collectionsData.collections.length;
                    
                    // Load document counts for each collection
                    await loadCollectionStats(collectionsData.collections);
                }
                
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        async function loadCollectionStats(collections) {
            const collectionStats = [];
            let totalDocuments = 0;
            let totalSize = 0;
            
            for (const collection of collections) {
                const collName = typeof collection === 'string' ? collection : collection.name;
                
                try {
                    const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
                    const response = await fetch(`${API_BASE_URL}/api/collections/${collName}/documents`, { headers });
                    const data = await response.json();
                    
                    const documents = data.documents || [];
                    const docCount = documents.length;
                    totalDocuments += docCount;
                    
                    // Calculate average document size
                    let avgSize = 0;
                    if (docCount > 0) {
                        const totalDocSize = documents.reduce((sum, doc) => 
                            sum + JSON.stringify(doc).length, 0);
                        avgSize = totalDocSize / docCount;
                        totalSize += totalDocSize;
                    }
                    
                    collectionStats.push({
                        name: collName,
                        count: docCount,
                        avgSize: avgSize,
                        lastModified: documents.length > 0 ? 
                            new Date(Math.max(...documents.map(d => 
                                new Date(d._updated || d._created || 0).getTime()))) : null
                    });
                    
                } catch (error) {
                    console.error(`Error loading stats for ${collName}:`, error);
                    collectionStats.push({
                        name: collName,
                        count: 0,
                        avgSize: 0,
                        lastModified: null
                    });
                }
            }
            
            // Update totals
            document.getElementById('documents-count').textContent = totalDocuments;
            document.getElementById('database-size').textContent = formatBytes(totalSize);
            
            // Update collections chart
            updateCollectionsChart(collectionStats);
            
            // Update collections table
            updateCollectionsTable(collectionStats);
        }

        function updateCollectionsChart(stats) {
            const ctx = document.getElementById('collections-chart').getContext('2d');
            
            const data = {
                labels: stats.map(s => s.name),
                datasets: [{
                    label: 'Documents',
                    data: stats.map(s => s.count),
                    backgroundColor: [
                        'rgba(54, 162, 235, 0.5)',
                        'rgba(255, 99, 132, 0.5)',
                        'rgba(255, 206, 86, 0.5)',
                        'rgba(75, 192, 192, 0.5)',
                        'rgba(153, 102, 255, 0.5)',
                    ],
                    borderColor: [
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 99, 132, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(153, 102, 255, 1)',
                    ],
                    borderWidth: 1
                }]
            };
            
            if (collectionsChart) {
                collectionsChart.data = data;
                collectionsChart.update();
            } else {
                collectionsChart = new Chart(ctx, {
                    type: 'bar',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        }

        function updateHealthChart(healthData) {
            const ctx = document.getElementById('health-chart').getContext('2d');
            
            const memoryUsage = healthData.memory ? 
                ((healthData.memory.used_kb / healthData.memory.total_kb) * 100).toFixed(1) : 0;
            
            const data = {
                labels: ['Memory Usage', 'Load Average'],
                datasets: [{
                    label: 'System Metrics',
                    data: [memoryUsage, (healthData.load_average || 0) * 10],
                    backgroundColor: [
                        'rgba(75, 192, 192, 0.5)',
                        'rgba(153, 102, 255, 0.5)'
                    ],
                    borderColor: [
                        'rgba(75, 192, 192, 1)',
                        'rgba(153, 102, 255, 1)'
                    ],
                    borderWidth: 1
                }]
            };
            
            if (healthChart) {
                healthChart.data = data;
                healthChart.update();
            } else {
                healthChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                            }
                        }
                    }
                });
            }
        }

        function updateCollectionsTable(stats) {
            const tbody = document.getElementById('collections-table');
            
            if (stats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">No collections found</td></tr>';
                return;
            }
            
            tbody.innerHTML = stats.map(stat => `
                <tr>
                    <td>${stat.name}</td>
                    <td>${stat.count}</td>
                    <td>${formatBytes(stat.avgSize)}</td>
                    <td>${stat.lastModified ? new Date(stat.lastModified).toLocaleString() : 'N/A'}</td>
                </tr>
            `).join('');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
