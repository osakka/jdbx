<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Database Admin Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme-overrides.css">
    <script src="js/theme.js"></script>
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease;
        }
        .login-container {
            max-width: 400px;
            padding: 40px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            transition: background-color 0.3s ease;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-floating {
            margin-bottom: 16px;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }
        .error-message {
            color: var(--accent-danger);
            margin-top: 15px;
            display: none;
        }
        .theme-toggle-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        h2 {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" onclick="themeManager.toggleTheme()">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>
    <div class="container">
        <div class="login-container">
            <div class="logo">
                <img src="/resources/jdbx_logo_dark.svg" alt="JDBX" data-theme-logo style="width: 200px; margin-bottom: 20px;">
            </div>
            
            <form id="loginForm">
                <div class="form-floating">
                    <input type="text" class="form-control" id="username" placeholder="Username" required>
                    <label for="username">Username</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
                
                <div class="error-message" id="errorMessage">
                    Invalid username or password
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Hide error message
            document.getElementById('errorMessage').style.display = 'none';
            
            // Send login request (server has /api/login, not /api/auth/login)
            fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    // Store the JWT token
                    localStorage.setItem('jdbx_auth_token', data.token);
                    if (data.refresh_token) {
                        localStorage.setItem('jdbx_refresh_token', data.refresh_token);
                    }
                    // Redirect to dashboard
                    window.location.href = '/';
                } else {
                    // Show error message
                    document.getElementById('errorMessage').style.display = 'block';
                    if (data.error) {
                        document.getElementById('errorMessage').textContent = data.error;
                    }
                }
            })
            .catch(error => {
                console.error('Login error:', error);
                document.getElementById('errorMessage').style.display = 'block';
            });
        });
    </script>
</body>
</html>
