<!DOCTYPE html>
<html>
<head>
    <title>JDBX Browser Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
        button { margin: 5px; padding: 8px 16px; border: 1px solid #007bff; background: #007bff; color: white; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .library-selector { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 4px; }
        select { padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>JDBX Browser Functionality Test</h1>
    
    <div class="library-selector">
        <label>Current Library: </label>
        <select id="librarySelector">
            <option value="default">default</option>
            <option value="system">system</option>
        </select>
        <button onclick="switchLibrary()">Switch Library</button>
        <button onclick="testAllLibraries()">Test All Libraries</button>
    </div>
    
    <div class="test-section">
        <h3>Test Controls</h3>
        <button onclick="testCollectionsAPI()">Test Collections API</button>
        <button onclick="testBrowserFunctions()">Test Browser Functions</button>
        <button onclick="testCreateCollection()">Test Create Collection</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="testResults"></div>
    
    <script>
        let authToken = null;
        let currentLibrary = 'default';
        let allCollections = [];
        let libraries = [];
        
        const results = document.getElementById('testResults');
        
        async function initialize() {
            try {
                // Get auth token
                const authResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: 'admin123' })
                });
                
                if (authResponse.ok) {
                    const authData = await authResponse.json();
                    authToken = authData.token;
                    addResult('Authentication', `Login successful`, 'success');
                    
                    // Test collections API immediately
                    await testCollectionsAPI();
                } else {
                    addResult('Authentication', `LOGIN FAILED: ${authResponse.status}`, 'error');
                }
            } catch (error) {
                addResult('Initialization', `FAILED: ${error.message}`, 'error');
            }
        }
        
        async function testCollectionsAPI() {
            if (!authToken) {
                addResult('Collections API', 'ERROR: No auth token available', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/collections', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    allCollections = data.collections || [];
                    
                    // Group by library
                    const byLibrary = {};
                    allCollections.forEach(col => {
                        if (!byLibrary[col.library]) byLibrary[col.library] = [];
                        byLibrary[col.library].push(`${col.name} (${col.document_count} docs)`);
                    });
                    
                    addResult('Collections API', `Found ${allCollections.length} collections`, 'success');
                    addResult('Library Structure', `<pre>${JSON.stringify(byLibrary, null, 2)}</pre>`, 'info');
                    
                    // Extract unique libraries
                    libraries = [...new Set(allCollections.map(c => c.library))];
                    updateLibrarySelector();
                    
                } else {
                    addResult('Collections API', `FAILED: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult('Collections API', `ERROR: ${error.message}`, 'error');
            }
        }
        
        function updateLibrarySelector() {
            const selector = document.getElementById('librarySelector');
            selector.innerHTML = libraries.map(lib => {
                const count = allCollections.filter(c => c.library === lib).length;
                return `<option value="${lib}" ${lib === currentLibrary ? 'selected' : ''}>${lib} (${count} collections)</option>`;
            }).join('');
        }
        
        function switchLibrary() {
            const selector = document.getElementById('librarySelector');
            currentLibrary = selector.value;
            
            const collections = allCollections.filter(c => c.library === currentLibrary);
            addResult(`Switch to ${currentLibrary}`, `Found ${collections.length} collections in ${currentLibrary} library`, 'success');
            
            if (collections.length > 0) {
                addResult(`${currentLibrary} Collections`, 
                    `<pre>${collections.map(c => `${c.name} (${c.document_count} docs)`).join('\\n')}</pre>`, 'info');
            }
        }
        
        async function testAllLibraries() {
            for (const library of libraries) {
                currentLibrary = library;
                document.getElementById('librarySelector').value = library;
                
                const collections = allCollections.filter(c => c.library === library);
                addResult(`Library: ${library}`, `${collections.length} collections`, collections.length > 0 ? 'success' : 'info');
                
                // Test one collection from each library
                if (collections.length > 0) {
                    const testCollection = collections[0];
                    await testCollectionDocuments(testCollection);
                }
            }
        }
        
        async function testCollectionDocuments(collection) {
            try {
                const response = await fetch(`/api/collections/${collection.path}/documents`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const docs = data.documents || [];
                    addResult(`${collection.path} Documents`, `${docs.length} documents found`, 'success');
                } else {
                    addResult(`${collection.path} Documents`, `FAILED to load: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`${collection.path} Documents`, `ERROR: ${error.message}`, 'error');
            }
        }
        
        async function testCreateCollection() {
            const collectionName = `test_${Date.now()}`;
            
            try {
                // Create a document in a new collection
                const response = await fetch(`/api/collections/${currentLibrary}/${collectionName}/documents`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: 'Test Document',
                        description: `Test document in ${collectionName} collection`,
                        created_by: 'Browser Test'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('Create Collection', `Created collection "${collectionName}" with test document`, 'success');
                    
                    // Refresh collections list
                    await testCollectionsAPI();
                } else {
                    addResult('Create Collection', `FAILED to create collection: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult('Create Collection', `ERROR: ${error.message}`, 'error');
            }
        }
        
        async function testBrowserFunctions() {
            addResult('Browser Functions', 'Testing main browser functionality...', 'info');
            
            // Test 1: Library filtering
            const defaultCollections = allCollections.filter(c => c.library === 'default');
            const systemCollections = allCollections.filter(c => c.library === 'system');
            
            addResult('Library Filtering', 
                `Default: ${defaultCollections.length}, System: ${systemCollections.length}`, 'success');
            
            // Test 2: Collection data structure
            if (allCollections.length > 0) {
                const sample = allCollections[0];
                const hasRequiredFields = sample.name && sample.library && sample.path;
                addResult('Collection Structure', 
                    hasRequiredFields ? 'All required fields present' : 'MISSING required fields', 
                    hasRequiredFields ? 'success' : 'error');
            }
            
            // Test 3: Document counts
            const totalDocs = allCollections.reduce((sum, c) => sum + (c.document_count || 0), 0);
            addResult('Document Counts', `Total documents across all collections: ${totalDocs}`, 'success');
        }
        
        function addResult(test, message, type) {
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = `<strong>${test}:</strong> ${message}`;
            results.appendChild(div);
            
            // Auto-scroll to bottom
            div.scrollIntoView({ behavior: 'smooth' });
        }
        
        function clearResults() {
            results.innerHTML = '';
        }
        
        // Initialize when page loads
        initialize();
    </script>
</body>
</html>
