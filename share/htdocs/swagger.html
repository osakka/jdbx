<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSONdb API Documentation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/unified-theme.css">
    <link rel="stylesheet" href="css/theme-overrides.css">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <script src="js/theme.js"></script>
    <style>
        /* Swagger-specific styles only */
        .swagger-container {
            margin-top: 1rem;
            background-color: var(--bg-primary);
        }
        
        /* Swagger UI Theme Overrides */
        .swagger-ui {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }
        
        .swagger-ui .topbar {
            display: none;
        }
        
        [data-theme="dark"] .swagger-ui {
            filter: invert(0.88) hue-rotate(180deg);
        }
        
        [data-theme="dark"] .swagger-ui img,
        [data-theme="dark"] .swagger-ui svg {
            filter: invert(1) hue-rotate(180deg);
        }
    </style>
</head>
<body class="page-swagger">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin.html">
                <img src="/resources/jsondb_logo_white.svg" alt="JSONdb" style="height: 40px;" data-theme-logo>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a class="nav-link" href="/browser.html"><i class="bi bi-folder2-open"></i> Browser</a>
                <a class="nav-link" href="/metrics.html"><i class="bi bi-graph-up"></i> Metrics</a>
                <a class="nav-link" href="/rbac.html"><i class="bi bi-shield-lock"></i> RBAC</a>
                <a class="nav-link active" href="/swagger.html"><i class="bi bi-book"></i> API Docs</a>
                <button class="btn btn-sm btn-outline-danger ms-3" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <!-- Header -->
        <div class="section-header">
            <h2>API Documentation</h2>
            <p>Explore and test JSONdb REST API endpoints</p>
        </div>

        <!-- API Info Card -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Base URL</h5>
                        <code id="baseUrl">http://localhost:5000/api</code>
                    </div>
                    <div class="col-md-6">
                        <h5>Authentication</h5>
                        <p class="mb-0">Include your JWT token in the Authorization header:</p>
                        <code>Authorization: Bearer &lt;token&gt;</code>
                    </div>
                </div>
            </div>
        </div>

        <!-- Swagger UI Container -->
        <div class="swagger-container">
            <div id="swagger-ui"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('jsondb_auth_token');
            localStorage.removeItem('jsondb_refresh_token');
            window.location.href = '/login.html';
        }

        // Update base URL
        document.getElementById('baseUrl').textContent = window.location.origin + '/api';

        // Initialize Swagger UI
        window.onload = function() {
            // Get the auth token
            const token = localStorage.getItem('jsondb_auth_token');
            
            window.ui = SwaggerUIBundle({
                url: "/api/docs/openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                requestInterceptor: (request) => {
                    if (token) {
                        request.headers['Authorization'] = 'Bearer ' + token;
                    }
                    return request;
                }
            });
        };
    </script>
</body>
</html>
